/* variables.css */
:root {
  color-scheme: dark;
  --midnight: #060817;
  --indigo: #111739;
  --lavender: #d4bcff;
  --rose: #ffc5e3;
  --gold: #fff0c1;
  --aurora: #90d9ff;
  --pearl: #faf6ff;
  --accent: #d4bcff;
  --secondary: #90d9ff;
  --ink: #342c4c;
  --ink-muted: #686078;
  --ease: cubic-bezier(.22,1,.36,1);

}


/* animations.css */
@keyframes nebula-drift-a{from{transform:translate3d(-2%,-4%,0) rotate(-5deg)}to{transform:translate3d(9%,8%,0) rotate(11deg)}}
@keyframes nebula-drift-b{from{transform:translate3d(5%,-5%,0) rotate(-4deg)}to{transform:translate3d(-9%,9%,0) rotate(8deg)}}
@keyframes nebula-drift-c{from{transform:translate3d(-2%,0,0)}to{transform:translate3d(9%,-9%,0)}}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.15);opacity:1}}
@keyframes orbit{to{transform:rotate(calc(360deg + var(--orbit-angle,0deg)))}}
@keyframes stellar-flicker{0%,100%{opacity:.85;transform:scale(.95)}50%{opacity:1;transform:scale(1.12)}}
@keyframes rise-in{from{opacity:0;transform:translateY(20px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes trail-pass{0%{opacity:0;transform:translate(150px,-85px) rotate(-35deg) scaleX(.4)}20%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(-330px,180px) rotate(-35deg) scaleX(1.2)}}
@keyframes constellation-draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes point-appear{0%{opacity:0;transform:scale(.1)}100%{opacity:1;transform:scale(1)}}
@keyframes gleam{0%,100%{opacity:.30}50%{opacity:.65}}
@keyframes wish-pulse{0%,100%{transform:scale(1);box-shadow:0 0 18px #ddbdff66}50%{transform:scale(1.08);box-shadow:0 0 33px #efceff99}}
@keyframes seal-glow{0%,100%{box-shadow:0 0 0 6px #d5b9ff17,0 0 23px #e3caff88}50%{box-shadow:0 0 0 10px #d5b9ff10,0 0 31px #e3caffaa}}

/* Phần tử vật lý duy nhất được morph giữa 6 trạng thái. */
.morph-object{position:fixed;left:50%;top:27dvh;width:118px;height:118px;transform:translate(-50%,-50%);z-index:5;pointer-events:none;transition:top 1080ms cubic-bezier(.26,.72,.19,1),width 1050ms cubic-bezier(.26,.72,.19,1),height 1050ms cubic-bezier(.26,.72,.19,1),border-radius 1050ms ease,filter 700ms ease;will-change:top,width,height;--orbit-angle:0deg}
.morph-halo{position:absolute;inset:-47%;border-radius:50%;background:radial-gradient(circle,rgba(210,182,255,.26) 0%,rgba(106,80,214,.13) 32%,transparent 69%);filter:blur(10px);animation:breathe 6s ease-in-out infinite;transition:opacity .5s,transform 1s}
.morph-core{position:absolute;inset:26%;border-radius:22%;clip-path:polygon(50% 0,61% 36%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 36%);background:radial-gradient(circle at 42% 37%,#ffffff 1%,var(--gold) 20%,var(--accent) 57%,#a7a0ff 100%);box-shadow:0 0 25px var(--accent);filter:drop-shadow(0 0 15px var(--accent)) drop-shadow(0 0 22px rgba(212,188,255,.4));animation:stellar-flicker 4.5s ease-in-out infinite;transition:opacity 500ms,clip-path 700ms,transform 850ms var(--ease)}
.morph-ray{position:absolute;inset:-16%;border-radius:50%;background:conic-gradient(from 45deg,transparent 0deg,rgba(255,246,216,.1) 50deg,transparent 92deg,transparent 175deg,rgba(255,246,216,.09) 205deg,transparent 255deg);filter:blur(6px);animation:orbit 22s linear infinite;opacity:.65;transition:opacity 500ms}
.morph-orbit{position:absolute;inset:-33%;border-radius:50%;border:1px solid rgba(226,212,255,.18);transform:rotate(var(--orbit-angle));animation:orbit 34s linear infinite;transition:opacity 500ms}
.morph-orbit::after{content:'';width:5px;height:5px;position:absolute;top:16%;right:14%;border-radius:50%;background:var(--gold);box-shadow:0 0 15px var(--gold)}
.morph-orbit-b{inset:-64%;border-color:rgba(158,194,255,.10);animation-duration:46s;animation-direction:reverse;transform:rotate(31deg)}
.morph-orbit-b::after{width:3px;height:3px;top:64%;right:3%;background:var(--secondary)}
.morph-object[data-stage='lookup']{top:18dvh;width:90px;height:90px}
.morph-object[data-stage='recognize']{top:40dvh;width:205px;height:205px}
.morph-object[data-stage='recognize'] .morph-core{transform:scale(1.2);filter:drop-shadow(0 0 22px var(--accent)) drop-shadow(0 0 40px var(--secondary))}
.app-shell.star-recognized .morph-halo{transform:scale(1.6);opacity:1}
.morph-object[data-stage='envelope']{top:43dvh;width:min(340px,84vw);height:220px}
.morph-object[data-stage='envelope'] .morph-halo{opacity:.56;transform:scale(1.4)}
.morph-object[data-stage='envelope'] .morph-core,.morph-object[data-stage='envelope'] .morph-ray,.morph-object[data-stage='envelope'] .morph-orbit{opacity:0;transform:scale(.45)}
.morph-object[data-stage='letter']{top:50dvh;width:min(740px,calc(100vw - 28px));height:min(790px,calc(100dvh - 158px));border-radius:24px}
.morph-object[data-stage='letter'] .morph-halo,.morph-object[data-stage='letter'] .morph-core,.morph-object[data-stage='letter'] .morph-ray,.morph-object[data-stage='letter'] .morph-orbit{opacity:0;animation:none}
.morph-object[data-stage='closing']{top:25dvh;width:142px;height:142px}
.morph-object[data-stage='closing'] .morph-core{transform:scale(1.15);animation:stellar-flicker 3.2s ease-in-out infinite}
.morph-object[data-stage='closing'] .morph-orbit{border-color:rgba(240,220,255,.28)}

/* Phong thư nhiều lớp: giấy trượt lên trước khi morph thành khung đọc. */
.envelope-shell{position:absolute;inset:0;opacity:0;transform:scale(.62);transition:opacity 550ms,transform 750ms var(--ease);filter:drop-shadow(0 24px 28px rgba(6,5,29,.43));perspective:900px;visibility:hidden}
.morph-object[data-stage='envelope'] .envelope-shell{opacity:1;transform:scale(1);visibility:visible}
.morph-object[data-stage='letter'] .envelope-shell{opacity:0;transform:scale(1.34);visibility:hidden;transition:opacity 700ms ease,transform 950ms var(--ease),visibility 700ms}
.envelope-back{position:absolute;left:0;right:0;bottom:0;height:70%;border-radius:0 0 15px 15px;background:linear-gradient(130deg,#cab6f2,#f8d4e9 55%,#a8bae9);border:1px solid #f4e6ff88;box-shadow:inset 0 2px 15px rgba(255,255,255,.25)}
.envelope-insert{position:absolute;left:9%;width:82%;height:77%;bottom:5%;z-index:2;background:linear-gradient(160deg,#fffdfd,#faf4ff);border-radius:5px 5px 3px 3px;box-shadow:0 3px 22px rgba(48,32,85,.15);transform:translateY(25px);transition:transform 850ms cubic-bezier(.2,.9,.32,1);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 8px;gap:9px;color:#5d4c86;text-align:center}
.envelope-insert-star{font-size:22px;color:#b39ad8}
.envelope-insert-name{font-family:var(--font-serif);font-size:15px;font-style:italic}
.envelope-insert-date{font-size:9px;letter-spacing:.18em}
.envelope-front{position:absolute;left:0;right:0;bottom:0;height:70%;z-index:3;border-radius:0 0 15px 15px;clip-path:polygon(0% 0%,50% 52%,100% 0%,100% 100%,0% 100%);background:linear-gradient(155deg,#e6d3ff 0%,#c4b3e9 45%,#dbc6f4 72%,#facde3 100%);box-shadow:inset 0 -15px 40px #b9a3d83d}
.envelope-flap{position:absolute;left:0;right:0;top:30%;height:53%;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(165deg,#f9e0f2,#e4cffb 50%,#c6b3ee);transform-origin:50% 0%;transform:rotateX(0deg);backface-visibility:visible;transition:transform 850ms cubic-bezier(.21,.76,.23,1)}
.envelope-seal{position:absolute;left:50%;top:66%;width:43px;height:43px;display:grid;place-items:center;z-index:5;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 30% 25%,#efddff,#b992dc);box-shadow:0 0 0 6px #d5b9ff17,0 0 23px #e3caff88;color:#fff9ff;font-size:23px;transition:opacity 300ms;animation:seal-glow 4s infinite}
.envelope-shell.opened .envelope-flap{transform:rotateX(178deg);z-index:1}
.envelope-shell.opened .envelope-insert{transform:translateY(-52px)}
.envelope-shell.opened .envelope-seal{opacity:0}

/* Tờ giấy thật trở thành bề mặt đọc, cuộn độc lập an toàn cho cảm ứng. */
.letter-sheet{position:absolute;inset:0;border:1px solid rgba(255,255,255,.92);border-radius:24px;background:linear-gradient(151deg,#fffefa 0%,#fbf7ff 52%,#f5f1fc 100%);color:var(--ink);box-shadow:0 22px 90px rgba(4,4,22,.47),0 0 0 7px rgba(228,201,255,.075),inset 0 1px 0 rgba(255,255,255,.95);opacity:0;transform:translateY(38px) scale(.88);clip-path:inset(30% 16% 18% 16% round 16px);transition:transform 960ms var(--ease),clip-path 1000ms var(--ease),opacity 560ms,visibility 560ms;pointer-events:none;visibility:hidden;overflow:hidden}
.letter-sheet::before{content:'';pointer-events:none;position:absolute;inset:10px;border-radius:17px;border:1px solid rgba(157,133,195,.12);z-index:1}
.letter-sheet::after{content:'✧';position:absolute;right:27px;top:18px;font-size:28px;color:#ab91c7;opacity:.3;pointer-events:none}
.morph-object[data-stage='letter'] .letter-sheet{opacity:1;transform:translateY(0) scale(1);clip-path:inset(0% 0% 0% 0% round 24px);visibility:visible;pointer-events:auto}
.letter-scroll{position:relative;z-index:2;height:100%;width:100%;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:clamp(24px,5vw,60px) clamp(21px,6vw,68px) clamp(35px,5vw,54px);scrollbar-color:#ccb6e0 transparent;scrollbar-width:thin}
.letter-scroll::-webkit-scrollbar{width:6px}
.letter-scroll::-webkit-scrollbar-thumb{background:#ccb6e0;border-radius:6px}
.letter-scroll::before{content:'';position:absolute;left:50%;top:15px;width:62%;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#e7d7f4,transparent);pointer-events:none}
.letter-scroll .paper-ornament{text-align:center;color:#a88cc8;letter-spacing:.8em;font-size:12px;margin:4px auto 19px;opacity:.8}
.letter-date{text-align:center;color:#8f78a5;letter-spacing:.24em;font-size:9px;font-weight:700;margin-bottom:19px}
.letter-title{font-family:var(--font-serif);font-weight:500;letter-spacing:-.035em;line-height:1.2;text-align:center;font-size:clamp(31px,5.6vw,51px);margin:0;color:#4a355e}
.letter-to{text-align:center;font-size:12px;color:#867895;line-height:1.5;margin:11px 0 24px}

.wish-area{text-align:center;margin:38px auto 0;border-top:1px solid #e9e0f0;padding:29px 0 1px}

.constellation-line{stroke-dasharray:420;stroke-dashoffset:420;animation:constellation-draw 1650ms ease-out 50ms forwards}

.comet-particle{position:absolute;left:0;top:0;z-index:9;width:9px;height:9px;border-radius:50%;background:#fff8ec;box-shadow:0 0 16px 6px var(--accent),0 0 40px 9px var(--secondary);pointer-events:none}


/* global.css */

/** Element builder: luôn dùng textContent cho dữ liệu người nhận, tránh HTML injection. */
function el                                       (
  tag   , className = '', text = ''
)                           {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function wait(ms        , signal              )                {
  return new Promise((resolve) => {
    if (signal?.aborted) { resolve(); return; }
    const timer = window.setTimeout(finish, ms);
    function finish() { window.clearTimeout(timer); signal?.removeEventListener('abort', finish); resolve(); }
    signal?.addEventListener('abort', finish, { once: true });
  });
}

// ---- utils/validateStt ----
                            
                             
                                   

/** Không lộ danh sách người nhận; chỉ kiểm tra cú pháp và khoảng STT 1–46. */
function validateStt(raw        )                 {
  const normalized = raw.trim();
  if (!/^[0-9]+$/.test(normalized)) {
    return { ok: false, message: 'Hãy nhập số thứ tự của bạn bằng chữ số từ 1 đến 46 nhé.' };
  }
  const stt = Number(normalized);
  if (!Number.isSafeInteger(stt) || stt < 1 || stt > 46) {
    return { ok: false, message: 'Số thứ tự hợp lệ nằm trong khoảng từ 1 đến 46.' };
  }
  return { ok: true, stt };
}


// ---- utils/visualSeed ----
                         
                 
                    
              
                                                   
                     
                     
  
const PALETTE                                                 = [
  ['#d4bcff', '#90d9ff', 261],
  ['#ffc5e3', '#d4bcff', 330],
  ['#fff0c1', '#ffc5e3', 42],
  ['#90d9ff', '#c5d7ff', 199],
  ['#e0ccff', '#ffe4cf', 276],
  ['#bde6e8', '#ded0ff', 171],
  ['#f3cfff', '#ffe1ec', 290],
  ['#cbd5ff', '#ffdbf0', 231]
];

/** Cùng một STT sẽ có màu và chòm sao giống nhau ở mọi lần truy cập. */
function makeVisualSeed(stt        )            {
  let seed = (stt * 2654435761) >>> 0;
  function rand()         {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const swatch = PALETTE[Math.floor(rand() * PALETTE.length)];
  const count = 6 + Math.floor(rand() * 3);
  const points                     = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2 + (rand() - .5) * .6;
    const radius = .22 + rand() * .25;
    points.push([.5 + Math.cos(angle) * radius, .5 + Math.sin(angle) * radius]);
  }
  return {
    accent: swatch[0], secondary: swatch[1], hue: swatch[2],
    points, orbitAngle: rand() * 360, burstCount: 10 + Math.floor(rand() * 10)
  };
}


// ---- hooks/useReducedMotion ----
function prefersReducedMotion()          {
  return typeof window !== 'undefined' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function observeReducedMotion(onChange                          )             {
  const media = window.matchMedia('(prefers-reduced-motion: reduce)');
  const handle = () => onChange(media.matches);
  media.addEventListener('change', handle);
  handle();
  return () => media.removeEventListener('change', handle);
}

/** Vỏ thư thật gồm mặt sau, giấy kéo ra, mặt trước, nắp có perspective rotateX. */
function createEnvelope()               {
  const root = el('div', 'envelope-shell');
  root.setAttribute('aria-hidden', 'true');
  const back = el('div', 'envelope-back');
  const paper = el('div', 'envelope-insert');
  paper.append(el('div', 'envelope-insert-star', '✦'));
  const recipient = el('div', 'envelope-insert-name', 'Dành riêng cho bạn');
  paper.append(recipient, el('div', 'envelope-insert-date', '08 . 03 . 2027'));
  const front = el('div', 'envelope-front');
  const flap = el('div', 'envelope-flap');
  const wax = el('div', 'envelope-seal', '✧');
  root.append(back, paper, front, flap, wax);
  return {
    root,
    setName: (name) => { recipient.textContent = `Gửi ${name}`; },
    setOpen: (open) => root.classList.toggle('opened', open)
  };
}

/** Canvas 2D theo hệ số DPR, tiết kiệm CPU/battery, không chặn touch scroll. */

  const root = el('div', 'galaxy-backdrop');
  root.setAttribute('aria-hidden', 'true');
  root.append(el('div', 'nebula nebula-purple'), el('div', 'nebula nebula-blue'), el('div', 'nebula nebula-rose'));
  const canvas = el('canvas', 'star-canvas');
  root.append(canvas);
  const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
  if (!ctx || !eventConfig.enableParticles) return { root, destroy: () => undefined };

  let width = 0; let height = 0; let dpr = 1;
  let stars         = [];
  let frameId = 0; let lastFrame = 0; let lastShooting = 0;
  let shooting = { visible: false, born: 0, x: 0, y: 0 };
  let reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let disposed = false; let pointerX = 0; let pointerY = 0;
  const motionMedia = window.matchMedia('(prefers-reduced-motion: reduce)');
  const lowPower = window.matchMedia('(max-width: 600px)').matches || (navigator.hardwareConcurrency || 8) <= 4;
  const fps = lowPower ? 30 : 45;
  const frameInterval = 1000 / fps;

  function resize()       {
    width = window.innerWidth; height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, lowPower ? 1.5 : 1.8);
    canvas.width = Math.ceil(width * dpr);
    canvas.height = Math.ceil(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx .setTransform(dpr, 0, 0, dpr, 0, 0);
    const desired = Math.min(350, Math.max(105, Math.round((width * height) / (lowPower ? 3100 : 3000))));
    // Mỗi lần resize tái tạo ít sao với seed cố định để tránh bước nhảy lớn.
    let seed = 0x27D7B;
    const rand = () => ((seed = (Math.imul(1664525, seed) + 1013904223) >>> 0) / 4294967296);
    stars = Array.from({ length: desired }, ()       => ({
      x: rand(), y: rand(),
      radius: .34 + rand() * (rand() > .94 ? 1.75 : .84),
      phase: rand() * Math.PI * 2, speed: .26 + rand() * 1.0,
      alpha: .25 + rand() * .62, depth: .25 + rand() * .75,
      hue: rand() > .82 ? 210 : rand() > .5 ? 267 : 43
    }));
    draw(performance.now());
  }
  function draw(now        )       {
    ctx .clearRect(0, 0, width, height);
    const t = now * .001;
    const parallaxX = reduced ? 0 : pointerX * 4;
    const parallaxY = reduced ? 0 : pointerY * 4;
    // Các chòm sao nền rất mảnh, không tranh sự chú ý với chữ.
    if (width > 350) {
      ctx .strokeStyle = 'rgba(188,184,239,.075)'; ctx .lineWidth = .7;
      const connect = [[3,8],[8,14],[14,19],[38,44],[44,49],[49,53],[65,70],[70,77],[77,80],[91,94],[94,99]];
      for (let k = 0; k < connect.length; k++) {
        const a = stars[connect[k][0] % stars.length], b = stars[connect[k][1] % stars.length];
        const dx = (a.x - b.x) * width, dy = (a.y - b.y) * height;
        if (dx * dx + dy * dy > 550 * 550) continue;
        ctx .beginPath();
        ctx .moveTo(a.x * width, a.y * height);
        ctx .lineTo(b.x * width, b.y * height);
        ctx .stroke();
      }
    }
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const twinkle = reduced ? 1 : .81 + Math.sin(t * s.speed + s.phase) * .19;
      const a = Math.min(1, s.alpha * twinkle);
      const x = s.x * width + parallaxX * s.depth;
      const y = s.y * height + parallaxY * s.depth;
      ctx .beginPath();
      ctx .fillStyle = `hsla(${s.hue}, 85%, 91%, ${a.toFixed(3)})`;
      ctx .arc(x, y, s.radius, 0, Math.PI * 2);
      ctx .fill();
      if (s.radius > 1.45) {
        ctx .strokeStyle = `rgba(250,242,255,${a * .28})`;
        ctx .lineWidth = .5;
        ctx .beginPath();ctx .moveTo(x-5,y);ctx .lineTo(x+5,y);ctx .moveTo(x,y-5);ctx .lineTo(x,y+5);ctx .stroke();
      }
    }
    if (!reduced && shooting.visible) {
      const age = now - shooting.born;
      if (age > 1000) shooting.visible = false;
      else {
        const p = age / 1000;
        const x = shooting.x - p * Math.min(width*.35,300), y = shooting.y + p * Math.min(height*.3,180);
        const gradient = ctx .createLinearGradient(x+85,y-55,x,y);
        gradient.addColorStop(0, 'rgba(255,255,255,0)');
        gradient.addColorStop(.75, `rgba(173,210,255,${(1-p)*.14})`);
        gradient.addColorStop(1, `rgba(250,247,255,${(1-p)*.8})`);
        ctx .strokeStyle = gradient;ctx .lineWidth = 1.5;
        ctx .beginPath();ctx .moveTo(x+85,y-55);ctx .lineTo(x,y);ctx .stroke();
      }
    }
    if (!reduced && now - lastShooting > 10500 && now > 4000) {
      lastShooting = now + Math.random() * 4500;
      shooting = { visible: true, born: now, x: width * (.58 + Math.random()*.4), y: height * (.06 + Math.random() * .31) };
    }
  }
  function tick(now        )       {
    frameId = 0;
    if (disposed || document.hidden || reduced) return;
    if (now - lastFrame >= frameInterval) { lastFrame = now; draw(now); }
    frameId = requestAnimationFrame(tick);
  }
  function updateLoop()       {
    cancelAnimationFrame(frameId); frameId = 0;
    if (!disposed && !document.hidden) {
      draw(performance.now());
      if (!reduced) frameId = requestAnimationFrame(tick);
    }
  }
  const onVisibility = () => updateLoop();
  const onResize = () => { resize(); updateLoop(); };
  const onMotion = () => { reduced = motionMedia.matches; updateLoop(); };
  const onPointer = (e              ) => {
    if (e.pointerType !== 'mouse') return;
    pointerX = (e.clientX / Math.max(1,width) - .5) * 2;
    pointerY = (e.clientY / Math.max(1,height) - .5) * 2;
  };
  window.addEventListener('resize', onResize, { passive: true });
  document.addEventListener('visibilitychange', onVisibility);
  motionMedia.addEventListener('change', onMotion);
  window.addEventListener('pointermove', onPointer, { passive: true });
  resize(); updateLoop();
  return {
    root,
    destroy() {
      disposed = true;cancelAnimationFrame(frameId);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('visibilitychange', onVisibility);
      motionMedia.removeEventListener('change', onMotion);
      window.removeEventListener('pointermove', onPointer);
    }
  };
}

/** Các đường chòm sao hiển thị theo seed STT, vẽ bằng SVG để đường có thể được 'viết ra'. */
function createStarField()                {
  const root = el('div', 'constellation-layer');
  root.setAttribute('aria-hidden', 'true');
  let current                       = null;
  let appearanceFrame = 0;
  function show(theme           )       {
    cancelAnimationFrame(appearanceFrame);
    root.classList.remove('is-visible');
    root.style.setProperty('--accent', theme.accent);
    root.style.setProperty('--secondary', theme.secondary);
    current?.remove();
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.classList.add('constellation-svg');
    const connections = [...theme.points, theme.points[0]];
    const polyline = document.createElementNS(ns, 'polyline');
    polyline.setAttribute('points', connections.map(([x,y]) => `${x * 100},${y * 100}`).join(' '));
    polyline.setAttribute('fill', 'none');
    polyline.setAttribute('stroke', 'var(--accent)');
    polyline.setAttribute('stroke-width', '.17');
    polyline.setAttribute('stroke-linejoin', 'round');
    polyline.setAttribute('vector-effect', 'non-scaling-stroke');
    polyline.classList.add('constellation-line');
    svg.append(polyline);
    theme.points.forEach(([x,y],i) => {
      const ring = document.createElementNS(ns, 'circle');
      ring.setAttribute('cx', `${x*100}`); ring.setAttribute('cy', `${y*100}`); ring.setAttribute('r', '1.0');
      ring.setAttribute('fill', 'var(--accent)'); ring.classList.add('constellation-dot');
      ring.style.animationDelay = `${i * 80}ms`;
      svg.append(ring);
    });
    current = svg; root.append(svg);
    appearanceFrame = requestAnimationFrame(() => root.classList.add('is-visible'));
  }
  function launchParticle(origin             , reduced         )       {
    if (reduced) return;
    const particle = el('div', 'comet-particle');
    root.append(particle);
    const from = origin.getBoundingClientRect();
    const x = from.left + from.width / 2;
    const y = from.top + from.height / 2;
    const toX = window.innerWidth / 2;
    const toY = window.innerHeight * .40;
    particle.style.left = `${x}px`; particle.style.top = `${y}px`;
    particle.animate([
      { transform: 'translate(-50%, -50%) scale(.2)', opacity: 0, offset: 0 },
      { transform: `translate(${(toX-x)*.46}px,${(toY-y)*.6-45}px) scale(1.3)`, opacity: 1, offset: .43 },
      { transform: `translate(${toX-x}px,${toY-y}px) scale(.1)`, opacity: 0, offset: 1 }
    ], { duration: 970, easing: 'cubic-bezier(.25,.5,.25,1)', fill: 'forwards' }).finished.catch(() => undefined).finally(() => particle.remove());
  }
  return { root, show, hide: () => { cancelAnimationFrame(appearanceFrame); root.classList.remove('is-visible'); }, launchParticle };
}

// ---- components/AudioToggle ----

/** Tiếng ngân nguyên bản được tổng hợp bằng Web Audio; chỉ khởi phát sau khi chạm. */
function createAudioToggle()                    {
  const button = el('button', 'audio-toggle', '♪  Bật âm thanh');
  button.type = 'button';
  button.setAttribute('aria-pressed', 'false');
  button.title = 'Âm thanh tùy chọn, mặc định tắt';
  let ctx                      = null;
  let timer = 0;
  let enabled = false;
  function play()       {
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime;
    const notes = [261.63, 329.63, 392.0];
    const oscillators                   = [];
    for (let i = 0; i < notes.length; i++) {
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = 'sine'; oscillator.frequency.value = notes[i] / 2;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(.015, now + 1.2 + .2 * i);
      gain.gain.exponentialRampToValueAtTime(.0001, now + 4.6);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(now); oscillator.stop(now + 4.8);
      oscillators.push(oscillator);
    }
  }
  async function setEnabled(value         )                {
    enabled = value;
    button.setAttribute('aria-pressed', String(value));
    button.textContent = value ? '♪  Tắt âm thanh' : '♪  Bật âm thanh';
    window.clearInterval(timer);
    if (value) {
      const AudioContextClass = window.AudioContext;
      if (!AudioContextClass) { enabled = false; button.textContent = 'Không hỗ trợ âm thanh'; button.disabled = true; return; }
      ctx ??= new AudioContextClass();
      try { await ctx.resume(); play(); timer = window.setInterval(play, 7000); }
      catch { enabled = false; button.setAttribute('aria-pressed', 'false'); button.textContent = '♪  Bật âm thanh'; }
    } else if (ctx) await ctx.suspend();
  }
  button.addEventListener('click', () => { void setEnabled(!enabled); });
  window.addEventListener('pagehide', () => { window.clearInterval(timer); void ctx?.close(); }, { once: true });
  return button;
}

  skipMotion.type = 'button';
  skipMotion.hidden = true;
  const recognizing = el('section', 'scene scene--recognize');
  recognizing.id = 'scene-recognize';
  const recognizeInner = el('div', 'scene-inner recognize-inner');
  const recognizeTag = el('p', 'eyebrow', 'BƯỚC 02 · NGÔI SAO ĐÃ ĐÁP LỜI');
  const recognizeName = el('h2', 'recognize-title');
  const recognizeSub = el('p', 'recognize-sub', 'Một lời chúc từ những người bạn của bạn.');
  recognizeInner.append(recognizeTag, recognizeName, recognizeSub);
  recognizing.append(recognizeInner);

  let stage           = 'intro';
  let recipient                   = null;
  let motionController                         = null;
  let motionReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let showToastTimer = 0;
  let sceneUpdateTimer = 0;

  const intro = createIntroScene(() => enterLookup());
  const lookup = createStudentLookup((stt) => { void beginReveal(stt); });
  const closing = createClosingScene(() => enterLookup());
  const letterView = createLetterView({
    onBack: () => enterLookup(),
    onReplay: () => {
      letterView.root.scrollTo({ top: 0, behavior: motionReduced ? 'instant' : 'smooth' });
      const paper = morph.sheet;
      if (!motionReduced) void paper.animate([
        { filter: 'brightness(1.03)' }, { filter: 'brightness(1)' }
      ], { duration: 680, easing: 'ease-out' }).finished.catch(() => undefined);
      letterView.focus();
    },
    onShare: () => { void shareGift(); },
    onWish: () => showClosing()
  });
  morph.sheet.append(letterView.root);
  story.append(intro, lookup.root, recognizing, closing.root);
  foreground.append(header, story, footer, skipMotion, toast);
  shell.append(galaxy.root, starField.root, morph.root, foreground);
  host.replaceChildren(shell);
  const allScenes = [intro, lookup.root, recognizing, closing.root];
  function setActiveScene(target                    )       {
    for (const scene of allScenes) {
      const active = scene === target;
      scene.classList.toggle('scene--active', active);
      scene.setAttribute('aria-hidden', active ? 'false' : 'true');
      scene.inert = !active;
    }
  }
  function setStage(value          )       {
    stage = value;
    shell.dataset.scene = value;
    morph.stage(value);
    skipMotion.hidden = value !== 'recognize' || motionReduced;
    if (value === 'intro') setActiveScene(intro);
    if (value === 'lookup') setActiveScene(lookup.root);
    if (value === 'recognize') setActiveScene(recognizing);
    if (value === 'letter') setActiveScene(null);
    if (value === 'closing') setActiveScene(closing.root);
  }
  function stopMotion()       {
    motionController?.abort(); motionController = null;
    window.clearTimeout(sceneUpdateTimer);
  }
  function enterLookup()       {
    stopMotion();
    morph.setOpened(false);
    starField.hide();
    lookup.reset();
    recipient = null;
    setStage('lookup');
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
  }
  function finishLetter()       {
    if (!recipient) return;
    stopMotion();
    morph.setOpened(true);
    setStage('letter');
    starField.hide();
    // Đợi hình học giấy hoàn tất rồi đưa focus đến tiêu đề cho screen reader.
    sceneUpdateTimer = window.setTimeout(() => letterView.focus(), motionReduced ? 30 : 750);
  }
  async function beginReveal(stt        )                {
    if (stage !== 'lookup') return;
    const match = recipientByStt.get(stt);
    if (!match) return;
    const letter = letters[match.letterId];
    if (!letter) return;
    recipient = match;
    const theme = makeVisualSeed(stt);
    morph.setRecipient(match.displayName, match.theme ? {
      ...theme, accent: match.theme.accent, secondary: match.theme.secondary
    } : theme);
    letterView.render(match, letter);
    recognizing.setAttribute('aria-labelledby', 'recognize-name');
    recognizeName.id = 'recognize-name';
    recognizeName.textContent = `Dành riêng cho ${match.displayName}`;
    closing.setName(match.displayName);
    starField.show(theme);
    setStage('recognize');
    if (motionReduced) { finishLetter(); return; }
    starField.launchParticle(lookup.form, false);
    const controller = new AbortController();
    motionController = controller;
    const { signal } = controller;
    await wait(850, signal); if (signal.aborted) return;
    shell.classList.add('star-recognized');
    await wait(430, signal); if (signal.aborted) return;
    morph.stage('envelope');
    await wait(650, signal); if (signal.aborted) return;
    morph.setOpened(true);
    await wait(880, signal); if (signal.aborted) return;
    shell.classList.remove('star-recognized');
    finishLetter();
  }
  skipMotion.addEventListener('click', finishLetter);
  function showClosing()       {
    if (!recipient) return;
    stopMotion();
    setStage('closing');
    closing.root.querySelector             ('#closing-title')?.focus({ preventScroll: true });
  }
  function notify(message        )       {
    toast.textContent = message;
    toast.classList.add('toast--visible');
    window.clearTimeout(showToastTimer);
    showToastTimer = window.setTimeout(() => toast.classList.remove('toast--visible'), 4000);
  }
  async function shareGift()                {
    const url = new URL(window.location.pathname, window.location.origin).href;
    const data = { title: 'GALAXY LETTERS — 08.03.2027', text: 'Một vũ trụ nhỏ, dành riêng cho bạn ✨', url };
    if (navigator.share) {
      try { await navigator.share(data); return; }
      catch (error) {
        if (error instanceof DOMException && error.name === 'AbortError') return;
      }
    }
    if (navigator.clipboard?.writeText) {
      try { await navigator.clipboard.writeText(url); notify('Đã sao chép đường dẫn món quà.'); return; }
      catch { /* Fallback cho trình duyệt không cho quyền clipboard. */ }
    }
    const temporary = el('textarea');
    temporary.value = url;
    temporary.setAttribute('aria-label', 'Đường dẫn để chia sẻ');
    temporary.style.position = 'fixed'; temporary.style.left = '-9999px';
    document.body.append(temporary);temporary.select();
    const copied = document.execCommand('copy');
    temporary.remove();
    notify(copied ? 'Đã sao chép đường dẫn món quà.' : `Hãy sao chép đường dẫn trên thanh địa chỉ để chia sẻ nhé.`);
  }
  const onKeydown = (event               ) => {
    if (event.key === 'Escape' && stage === 'recognize') finishLetter();
  };
  window.addEventListener('keydown', onKeydown);
  const unobserveMotion = observeReducedMotion((value) => {
    motionReduced = value;
    shell.classList.toggle('reduced-motion', value);
    skipMotion.hidden = value || stage !== 'recognize';
    if (value && stage === 'recognize') finishLetter();
  });
  setActiveScene(intro); // Ẩn semantic các scene khác ngay ở lần đầu, tránh screen reader đọc nhầm.
  if (!eventConfig.enableIntro) enterLookup();
  if (eventConfig.showCountdown) {
    const countdown = el('div', 'countdown');
    footer.prepend(countdown);
    const moment = new Date('2027-03-07T17:00:00Z').getTime(); // 00:00 ngày 08/03 giờ Việt Nam
    const update = () => {
      const days = Math.ceil((moment - Date.now()) / 86400000);
      countdown.textContent = days > 0 ? `Còn ${days} ngày đến 08.03.2027` : '';
    };
    update();const timer = window.setInterval(update, 60000);
    window.addEventListener('pagehide', () => window.clearInterval(timer), { once: true });
  }
  // Một kiểm tra nhẹ ở runtime, hữu ích khi chủ repo chỉnh sửa dữ liệu.
  if (recipients.length !== 24) console.warn('Số người nhận hiện khác 24, hãy kiểm tra dữ liệu trước khi phát hành.');
  return () => {
    stopMotion();unobserveMotion();galaxy.destroy();
    window.removeEventListener('keydown', onKeydown);
    window.clearTimeout(showToastTimer);
    shell.remove();
  };
}


// ---- main ----

const root = document.querySelector             ('#app');
if (!root) throw new Error('Không tìm thấy phần tử #app');
mountApp(root);


</script>
